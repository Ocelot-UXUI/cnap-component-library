Global:
    version: "2.0"
    group_email: ee-fe@baidu.com
Default:
    profile:
        - fcnap
Profiles:
    - profile:
      name: fcnap
      mode: AGENT
      environment:
        image: DECK_STD_CENTOS7
        tools:
            - nodejs: 24.latest
      build:
        command: |
            /bin/bash ./scripts/build_fcnap.sh
      artifacts:
        release: true
      check:
        - enable: true
          reuse: TASK
